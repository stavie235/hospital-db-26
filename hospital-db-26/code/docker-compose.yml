services:
  mariadb:
    build:
      context: ..
      dockerfile: code/Dockerfile
    container_name: hospital_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      HOSPITAL_DB_RELOAD_MODE: ${HOSPITAL_DB_RELOAD_MODE:-preserve}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "hospital-db-healthcheck.sh"]
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  db_data:
    name: hospital_db_data
